[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone-router"
version = "0.1.0"
description = "LangChain agent that routes each request through an open-source System One decision model (Laya by default) and picks a Claude model sized to the request's complexity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Run the decision model in-process instead of over HTTP (pulls in torch).
local = ["laya>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
